aid: knotel
name: Knotel
description: >-
  Knotel is a flexible workspace and managed office provider that designs, builds, and operates
  tailored office space for companies across a global network of locations including Amsterdam,
  Austin, Berlin, London, Miami, and Paris (through its Deskeo partner). Its business is organized
  around managed office experiences, member work clubs such as Wyncatcher and Old Sessions House,
  and a services arm covering design and delivery, fit-out, furniture, amenity and hospitality,
  workplace strategy, technology and AV, catering, and day-to-day workplace operations. Knotel also
  works directly with brokers and with building owners who want space leased and operated on their
  behalf. Knotel is a real estate services business and publishes no public developer API, SDKs, or
  developer portal; its member-facing mobile app is a white-labeled deployment of the Spacebring
  coworking platform. The one machine-readable surface it does publish is an llms.txt describing its
  site for AI agents, alongside a robots.txt that explicitly permits the major AI crawlers.
